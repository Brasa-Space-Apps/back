services:
  db:
    image: postgis/postgis:16-3.4
    container_name: brasa-db
    environment:
      POSTGRES_USER: brasa
      POSTGRES_PASSWORD: brasa
      POSTGRES_DB: brasa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasa -d brasa"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    container_name: brasa-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://brasa:brasa@db:5432/brasa
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
    restart: "no"
    command:
      - python
      - -c
      - |
        import os, subprocess, sys, psycopg

        tables = ("cell_days", "raw_hotspots", "pantanal_boundary", "factors")
        with psycopg.connect(os.environ["DATABASE_URL"]) as con, con.cursor() as cur:
            populated = all(
                cur.execute("SELECT to_regclass(%s)", (f"public.{t}",)).fetchone()[0] is not None
                and cur.execute(f"SELECT EXISTS (SELECT 1 FROM {t} LIMIT 1)").fetchone()[0]
                for t in tables
            )

        if populated:
            print("Banco já populado. Pulando load_postgis.py.")
            sys.exit(0)

        print("Banco vazio. Executando load_postgis.py...")
        sys.exit(subprocess.call([sys.executable, "/app/scripts/load_postgis.py", "--data", "/app/data"]))

volumes:
  pgdata:
